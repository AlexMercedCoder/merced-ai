name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.11"
          - os: ubuntu-latest
            python-version: "3.14"
          - os: macos-latest
            python-version: "3.13"
          - os: windows-latest
            python-version: "3.13"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: alexmerced-oss/open-agent-profile
          ref: 7fb633a1a59dd7636ffb0030d254f2f58934f74a
          path: upstream-oap
      - uses: actions/checkout@v7
        with:
          repository: AlexMercedCoder/agentic-graph-spec
          ref: f180a4dbd07911f90dd0821f531d7ccd51bb0764
          path: upstream-ags
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev]'
      - run: python -m ruff format --check src tests
      - run: python -m ruff check src tests
      - run: node --check src/merced_ai/webui/app.js
      - run: python -m pytest -q
        env:
          AGS_FIXTURE_REPO: ${{ github.workspace }}/upstream-ags
          OAP_FIXTURE_REPO: ${{ github.workspace }}/upstream-oap
      - run: |
          oap-validate upstream-oap/examples/*.agent.* upstream-oap/examples/json/* --digest
          oap-validate upstream-oap/examples/invalid --expect-invalid
        shell: bash
      - run: ags-validate upstream-ags/examples --strict
      - if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.14'
        run: python -m playwright install chromium --with-deps
      - if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.14'
        run: python -m pytest --no-cov tests/test_browser_e2e.py -q
        env:
          MERCED_AI_BROWSER_E2E: "1"
          MERCED_AI_SCREENSHOT_DIR: docs/screenshots/qa
      - if: always() && matrix.os == 'ubuntu-latest' && matrix.python-version == '3.14'
        uses: actions/upload-artifact@v7
        with:
          name: merced-ai-ui-screenshots
          path: docs/screenshots/qa
      - run: python -m build
