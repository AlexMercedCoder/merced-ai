name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.11"
          - os: ubuntu-latest
            python-version: "3.14"
          - os: macos-latest
            python-version: "3.13"
          - os: windows-latest
            python-version: "3.13"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev]'
      - run: python -m ruff format --check .
      - run: python -m ruff check .
      - run: node --check src/merced_ai/webui/app.js
      - run: python -m pytest -q
      - if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.14'
        run: python -m playwright install chromium --with-deps
      - if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.14'
        run: python -m pytest --no-cov tests/test_browser_e2e.py -q
        env:
          MERCED_AI_BROWSER_E2E: "1"
          MERCED_AI_SCREENSHOT_DIR: docs/screenshots/qa
      - if: always() && matrix.os == 'ubuntu-latest' && matrix.python-version == '3.14'
        uses: actions/upload-artifact@v7
        with:
          name: merced-ai-ui-screenshots
          path: docs/screenshots/qa
      - run: python -m build
