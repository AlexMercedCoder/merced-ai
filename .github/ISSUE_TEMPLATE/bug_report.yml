name: Bug report
description: Report a reproducible Merced AI defect.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Never include API keys or unreviewed harness logs.
  - type: input
    id: version
    attributes:
      label: Merced AI version
      placeholder: merced-ai 0.2.0
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Operating system and Python version
    validations:
      required: true
  - type: input
    id: harness
    attributes:
      label: Harness and version
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Provide minimal commands, expected behavior, and actual behavior.
    validations:
      required: true
  - type: textarea
    id: inventory
    attributes:
      label: Redacted inventory or error
      description: Review output before pasting; remove prompts, paths, IDs, and credentials.
