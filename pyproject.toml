[build-system]
requires = ["hatchling>=1.25,<2"]
build-backend = "hatchling.build"

[project]
name = "merced-ai"
version = "0.1.0"
description = "An OAP-native broker for existing AI agent harnesses."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Alex Merced" }]
keywords = ["agents", "cli", "oap", "acp", "codex", "automation"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]
dependencies = [
  "open-agent-profile>=1.0,<2",
  "pydantic>=2.9,<3",
  "PyYAML>=6.0,<7",
  "rich>=13.9,<15",
  "typer>=0.12.5,<1",
]

[project.optional-dependencies]
dev = [
  "build>=1.2,<2",
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "pytest>=8.3,<9",
  "pytest-cov>=5,<7",
  "ruff>=0.6,<1",
  "uvicorn>=0.30,<1",
]
webui = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
]

[project.scripts]
merced-ai = "merced_ai.cli:app"

[project.urls]
Homepage = "https://github.com/AlexMercedCoder/merced-ai"
Repository = "https://github.com/AlexMercedCoder/merced-ai"
Issues = "https://github.com/AlexMercedCoder/merced-ai/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/merced_ai"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=merced_ai --cov-report=term-missing --cov-fail-under=70"

[tool.coverage.run]
branch = true
source = ["merced_ai"]

[tool.coverage.report]
skip_covered = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
